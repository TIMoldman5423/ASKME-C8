<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C8 Ask</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1d1b;--mute:#6b6a64;--line:#dedbd2;--accent:#b3261e;--accent-ink:#fff;--ok:#1b6e3c}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#222220;--ink:#f1efe8;--mute:#a09e95;--line:#38362f;--accent:#e0584f;--accent-ink:#161614;--ok:#6fcf97}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:20px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{font-size:1.1rem;margin:0}
header .fresh{color:var(--mute);font-size:.8rem;flex:1}
header button{font-size:.8rem}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:46rem;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);white-space:pre-wrap}
.msg.me{align-self:flex-end;background:transparent;color:var(--mute)}
.msg.bot .tools{display:block;color:var(--mute);font-size:.7rem;margin-top:6px}
.msg.err{border-color:var(--accent);color:var(--accent)}
.hint{color:var(--mute);font-size:.85rem;max-width:46rem}
.examples{display:flex;flex-wrap:wrap;gap:8px}
.examples button{font-size:.85rem;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
footer{border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--card);display:flex;flex-direction:column;gap:8px}
.pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=text],input[type=password]{font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:48px}
select{flex:1;min-width:9rem}
#chip{display:none;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 14px;font-size:.9rem}
#chip button{border:0;background:transparent;color:var(--mute);font-size:1.1rem;padding:4px 10px;min-height:0}
.row{display:flex;gap:8px;align-items:stretch}
#q{flex:1;min-width:0}
button{font:inherit;font-size:1rem;min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.mic{width:56px;padding:0;font-size:1.4rem}
button.mic.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
label.speak{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:.85rem}
label.speak input{width:22px;height:22px}
.sub{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#login{margin:auto;max-width:22rem;padding:24px;display:none;flex-direction:column;gap:12px;text-align:center}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="login">
  <h1>C8 Ask</h1>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
  <button class="primary" id="go">Open</button>
  <div id="loginerr" class="hint" role="alert"></div>
</div>

<header id="top" style="display:none">
  <h1>C8 Ask</h1><span class="fresh" id="fresh"></span>
  <button id="clear">New chat</button><button id="out">Sign out</button>
</header>
<main id="log" aria-live="polite" style="display:none"></main>

<footer id="foot" style="display:none">
  <div class="pick">
    <select id="brand" aria-label="Brand"><option value="">Brand…</option></select>
    <select id="store" aria-label="Store" disabled><option value="">Store…</option></select>
    <span id="chip"><span id="chiptxt"></span><button id="chipx" aria-label="Clear store">×</button></span>
  </div>
  <div class="row">
    <button class="mic" id="mic" aria-label="Speak your question" title="Speak">🎤</button>
    <input id="q" type="text" placeholder="Type or tap the microphone…" autocomplete="off" enterkeyhint="send" aria-label="Your question">
    <button class="primary" id="send">Ask</button>
  </div>
  <div class="sub">
    <label class="speak"><input type="checkbox" id="speak" checked> Read answers aloud</label>
    <button id="stop" style="min-height:36px;font-size:.8rem;display:none">Stop speaking</button>
  </div>
</footer>

<script>
const $ = s => document.querySelector(s);
const state = { store: null, history: [], speaking: false };
const api = async (p, o) => { const r = await fetch(p, { credentials: 'same-origin', ...o }); if (r.status === 401 && p !== '/api/login') { showLogin(); throw new Error('login'); } return r; };

async function boot() {
  const s = await (await fetch('/api/session')).json();
  if (!s.loggedIn) return showLogin();
  showApp();
}
function showLogin() { $('#login').style.display = 'flex'; for (const id of ['#top', '#log', '#foot']) $(id).style.display = 'none'; $('#pw').focus(); }
$('#go').onclick = async () => {
  const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: $('#pw').value }) });
  if (r.ok) { $('#pw').value = ''; $('#login').style.display = 'none'; showApp(); } else $('#loginerr').textContent = r.status === 429 ? 'Too many tries. Wait a few minutes.' : 'Wrong password.';
};
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#go').click(); });
$('#out').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.reload(); };

async function showApp() {
  $('#top').style.display = 'flex'; $('#log').style.display = 'flex'; $('#foot').style.display = 'flex';
  const [stores, meta] = await Promise.all([api('/api/stores').then(r => r.json()), api('/api/meta').then(r => r.json())]);
  const d = new Date(meta.latest_week_ending + 'T00:00:00');
  $('#fresh').textContent = 'Data to week ending ' + d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  const b = $('#brand'); b.length = 1; stores.brands.forEach(x => b.add(new Option(x.brand.replace(' - OTR', ' (OTR)'), x.brand)));
  b.onchange = () => { const st = $('#store'); st.length = 1; const br = stores.brands.find(x => x.brand === b.value); st.disabled = !br; if (br) br.stores.forEach(s => st.add(new Option(s.name, s.id))); };
  $('#store').onchange = () => { const id = +$('#store').value; if (!id) return setStore(null); const br = stores.brands.find(x => x.brand === $('#brand').value); const s = br.stores.find(x => x.id === id); setStore({ id, name: s.name, brand: br.brand }); $('#q').focus(); };
  $('#chipx').onclick = () => { setStore(null); $('#store').value = ''; };
  welcome();
}
function setStore(s) { state.store = s; $('#chip').style.display = s ? 'inline-flex' : 'none'; if (s) $('#chiptxt').textContent = s.name + ' · ' + s.brand.replace(' - OTR', ''); }

function add(cls, text, extra) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; if (extra) { const t = document.createElement('span'); t.className = 'tools'; t.textContent = extra; d.appendChild(t); } $('#log').appendChild(d); d.scrollIntoView({ block: 'end' }); return d; }
function welcome() {
  $('#log').innerHTML = '';
  const h = document.createElement('div'); h.className = 'hint';
  h.innerHTML = 'Ask about store sales by voice or text. Choose a brand and store below if you do not want to say the name.';
  const ex = document.createElement('div'); ex.className = 'examples';
  ['What did the Noodle Box network do last week?', 'Top 5 Pattysmiths stores last week', 'Which brands were up on the week?', 'Which stores closed or transferred recently?'].forEach(t => { const b = document.createElement('button'); b.textContent = t; b.onclick = () => { $('#q').value = t; ask(); }; ex.appendChild(b); });
  $('#log').append(h, ex);
}
$('#clear').onclick = () => { state.history = []; setStore(null); $('#brand').value = ''; $('#brand').onchange(); stopSpeaking(); welcome(); };

async function ask() {
  const question = $('#q').value.trim(); if (!question) return;
  unlockSpeech(); stopSpeaking(); document.querySelectorAll('#log .hint,#log .examples').forEach(n => n.remove());
  $('#q').value = ''; add('me', (state.store ? `[${state.store.name}] ` : '') + question);
  const wait = add('bot', '…'); $('#send').disabled = true;
  try {
    const r = await api('/api/ask', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ question, store: state.store, history: state.history }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Error');
    wait.textContent = j.answer; state.history.push({ role: 'user', content: (state.store ? `(${state.store.name}, ${state.store.brand}) ` : '') + question }, { role: 'assistant', content: j.answer });
    state.history = state.history.slice(-8); say(j.answer);
  } catch (e) { if (e.message !== 'login') { wait.className = 'msg err'; wait.textContent = e.message === 'Failed to fetch' ? 'Could not reach the server.' : e.message; } }
  $('#send').disabled = false;
}
$('#send').onclick = ask;
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });

// ---- voice out ----
function pickVoice() { const v = speechSynthesis.getVoices(); return v.find(x => /en-AU/i.test(x.lang)) || v.find(x => /^en/i.test(x.lang)) || null; }
function unlockSpeech() { if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } }  // iOS needs a speak() inside the tap
function say(t) { if (!$('#speak').checked || !('speechSynthesis' in window)) return; const u = new SpeechSynthesisUtterance(t.replace(/\$(\d[\d,]*)/g, '$1 dollars')); const v = pickVoice(); if (v) u.voice = v; u.lang = (v && v.lang) || 'en-AU'; u.onstart = () => $('#stop').style.display = 'inline-block'; u.onend = u.onerror = () => $('#stop').style.display = 'none'; speechSynthesis.speak(u); }
function stopSpeaking() { if ('speechSynthesis' in window) speechSynthesis.cancel(); $('#stop').style.display = 'none'; }
$('#stop').onclick = stopSpeaking; if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};

// ---- voice in ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null;
if (!SR) { $('#mic').style.display = 'none'; }
$('#mic').onclick = () => {
  if (rec) { rec.stop(); return; }
  stopSpeaking(); rec = new SR(); rec.lang = 'en-AU'; rec.interimResults = true; rec.continuous = false;
  $('#mic').classList.add('on'); const base = $('#q').value ? $('#q').value + ' ' : '';
  rec.onresult = e => { let t = ''; for (const r of e.results) t += r[0].transcript; $('#q').value = base + t; };
  rec.onerror = e => { if (e.error === 'not-allowed') add('err', 'The microphone is blocked. Allow it in the browser settings for this site.'); };
  rec.onend = () => { $('#mic').classList.remove('on'); const had = rec; rec = null; if ($('#q').value.trim() && had) ask(); };
  rec.start();
};
boot();
</script>
</body>
</html>
